<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Maatwerk: observatie en opdracht bewerken</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2560BF}a:hover{color:#1F55AD}
.mw-lbl{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.6px;color:#5D6675}
.mw-in{box-sizing:border-box;padding:0 12px;border:1px solid #C9CED8;border-radius:8px;background:#FFFFFF;font:inherit;font-size:14px;font-weight:400;letter-spacing:0;color:#1B2230}
.mw-ta{box-sizing:border-box;padding:9px 12px;border:1px solid #C9CED8;border-radius:8px;background:#FFFFFF;font:inherit;font-size:14px;font-weight:400;letter-spacing:0;line-height:1.45;color:#1B2230;resize:vertical}
.mw-emo{width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:transparent;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.mw-emo:hover{background:#EEF0F3}
</style>
</helmet>
<div style="width: 100%; height: 960px; position: relative; overflow: hidden; background: #F5F6F8; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-size: 14px; color: #1B2230">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(16,24,40,.42)"></div>
  <div role="tablist" aria-label="Mock kiezen" style="position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 4px; padding: 4px; background: #1B2230; border-radius: 10px">
    <sc-for list="{{views}}" as="v" hint-placeholder-count="2">
      <button role="tab" aria-selected="{{v.sel}}" onClick="{{v.pick}}" style="height: 30px; padding: 0 14px; border: 0; border-radius: 7px; background: {{v.bg}}; color: {{v.fg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{v.label}}</button>
    </sc-for>
  </div>

  <sc-if value="{{isObs}}" hint-placeholder-val="{{ true }}">
    <section role="dialog" aria-modal="true" aria-labelledby="mw-ob" style="position: absolute; top: 64px; left: 50%; transform: translateX(-50%); width: 980px; height: 864px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 24px 64px rgba(16,24,40,.28); display: flex; flex-direction: column; overflow: hidden">
      <div style="flex: none; padding: 20px 24px 16px; border-bottom: 1px solid #E1E4EA; display: flex; align-items: center; gap: 12px">
        <h2 id="mw-ob" style="margin: 0; flex: 1; font-size: 22px; color: #2560BF">Observatie bewerken</h2>
        <button aria-label="Sluiten" style="width: 36px; height: 36px; border: 0; background: transparent; color: #5D6675; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px">
        <div style="overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; gap: 14px; align-items: flex-end">
            <div class="mw-lbl">ICOON<span style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid #2F6FD6; background: #2F6FD60F; display: flex; align-items: center; justify-content: center; font-size: 20px">{{emoji}}</span></div>
            <label class="mw-lbl" style="flex: 1">NAAM<input class="mw-in" style="height: 36px" value="Significantie antwoord verkeerd"></label>
          </div>
          <label class="mw-lbl">KORTE UITLEG<textarea class="mw-ta" rows="2">Leerling heeft bij het geven van een antwoord afgerond op een verkeerd aantal significante cijfers.</textarea></label>
          <label class="mw-lbl">LEERADVIES <span style="font-weight: 400; letter-spacing: 0; text-transform: none">Voor de leerling, in de toetsanalyse</span><textarea class="mw-ta" rows="4">Rond je antwoord af op het aantal significante cijfers van het minst nauwkeurige gegeven. Controleer dit in de antwoordstap van de GFBA-methode.</textarea></label>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: .6px; color: #5D6675">SCHOOLSOORT</span>
            <div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{types}}" as="st" hint-placeholder-count="7"><button aria-pressed="{{st.on}}" style="height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{st.border}}; background: {{st.bg}}; color: {{st.color}}; font: inherit; font-size: 13px; font-weight: {{st.w}}; cursor: pointer">{{st.label}}</button></sc-for></div>
          </div>
          <div style="display: flex; gap: 28px; flex-wrap: wrap">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 12px; font-weight: 700; letter-spacing: .6px; color: #5D6675">VAKKEN</span>
              <div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{vakken}}" as="st" hint-placeholder-count="4"><button aria-pressed="{{st.on}}" style="height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{st.border}}; background: {{st.bg}}; color: {{st.color}}; font: inherit; font-size: 13px; font-weight: {{st.w}}; cursor: pointer">{{st.label}}</button></sc-for></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 12px; font-weight: 700; letter-spacing: .6px; color: #5D6675">JAARLAGEN</span>
              <div style="display: flex; gap: 6px"><sc-for list="{{jl}}" as="st" hint-placeholder-count="6"><button aria-pressed="{{st.on}}" style="width: 34px; height: 30px; border-radius: 8px; border: 1px solid {{st.border}}; background: {{st.bg}}; color: {{st.color}}; font: inherit; font-size: 13px; font-weight: {{st.w}}; cursor: pointer">{{st.label}}</button></sc-for></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <span title="Voor welk soort toets deze observatie in de lijsten verschijnt" style="font-size: 12px; font-weight: 700; letter-spacing: .6px; color: #5D6675">TOETSTYPE</span>
              <div role="group" aria-label="Toetstype" style="display: flex; gap: 6px"><sc-for list="{{kinds}}" as="st" hint-placeholder-count="2"><button aria-pressed="{{st.on}}" onClick="{{st.pick}}" style="height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{st.border}}; background: {{st.bg}}; color: {{st.color}}; font: inherit; font-size: 13px; font-weight: {{st.w}}; cursor: pointer">{{st.label}}</button></sc-for></div>
            </div>
          </div>
        </div>
        <aside aria-label="Icoon kiezen" style="border-left: 1px solid #E1E4EA; background: #FAFBFC; display: flex; flex-direction: column; min-height: 0">
          <div style="padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 10px">
            <label style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid #C9CED8; border-radius: 8px; background: #FFFFFF; color: #5D6675">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
              <input placeholder="Zoek icoon (bijv. grafiek, lamp, molecuul)" aria-label="Zoek icoon" style="border: 0; outline: 0; background: transparent; font: inherit; color: #1B2230; width: 100%">
            </label>
            <div role="tablist" aria-label="Categorie" style="display: flex; gap: 4px; flex-wrap: wrap">
              <sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><button role="tab" aria-selected="{{c.sel}}" onClick="{{c.pick}}" style="height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">{{c.label}}</button></sc-for>
            </div>
          </div>
          <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 16px">
            <sc-for list="{{groupsE}}" as="ge" hint-placeholder-count="3">
              <div style="font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #5D6675; padding: 10px 4px 6px">{{ge.label}}</div>
              <div style="display: grid; grid-template-columns: repeat(9, 36px); gap: 2px">
                <sc-for list="{{ge.items}}" as="e" hint-placeholder-count="18"><button class="mw-emo" onClick="{{e.pick}}" aria-label="{{e.e}}" style="border-color: {{e.bd}}; background: {{e.bg}}">{{e.e}}</button></sc-for>
              </div>
            </sc-for>
          </div>
          <div style="padding: 8px 16px; border-top: 1px solid #E1E4EA; font-size: 12px; color: #5D6675">{{emojiCount}} iconen · nieuw: bèta en leren &amp; school</div>
        </aside>
      </div>
      <div style="flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 14px 24px 18px; border-top: 1px solid #E1E4EA">
        <button style="height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid #C9CED8; background: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">Annuleren</button>
        <button style="height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid #2F6FD6; background: #2F6FD6; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">Opslaan</button>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{isOpd}}" hint-placeholder-val="{{ false }}">
    <section role="dialog" aria-modal="true" aria-labelledby="mw-op" style="position: absolute; top: 64px; left: 50%; transform: translateX(-50%); width: 760px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 24px 64px rgba(16,24,40,.28); display: flex; flex-direction: column">
      <div style="padding: 20px 24px 16px; border-bottom: 1px solid #E1E4EA; display: flex; align-items: center; gap: 12px">
        <h2 id="mw-op" style="margin: 0; flex: 1; font-size: 22px; color: #2560BF">Opdracht bewerken</h2>
        <button aria-label="Sluiten" style="width: 36px; height: 36px; border: 0; background: transparent; color: #5D6675; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 18px">
        <label class="mw-lbl">NAAM<input class="mw-in" style="height: 36px" value="GFBA bovenbouw (+ significantie)"></label>
        <label class="mw-lbl">BESCHRIJVING<textarea class="mw-ta" rows="3">Leerling leert om bij berekeningen altijd de relevante gegevens, formule, berekening en antwoord te noteren. In de antwoordstap controleert de leerling ook de significantie en de eenheid van het antwoord.</textarea></label>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: .6px; color: #5D6675">SCHOOLSOORT</span>
          <div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{types}}" as="st" hint-placeholder-count="7"><button aria-pressed="{{st.on}}" style="height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{st.border}}; background: {{st.bg}}; color: {{st.color}}; font: inherit; font-size: 13px; font-weight: {{st.w}}; cursor: pointer">{{st.label}}</button></sc-for></div>
        </div>
        <div style="display: flex; gap: 28px; flex-wrap: wrap">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: .6px; color: #5D6675">VAKKEN</span>
            <div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{vakken}}" as="st" hint-placeholder-count="4"><button aria-pressed="{{st.on}}" style="height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{st.border}}; background: {{st.bg}}; color: {{st.color}}; font: inherit; font-size: 13px; font-weight: {{st.w}}; cursor: pointer">{{st.label}}</button></sc-for></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: .6px; color: #5D6675">JAARLAGEN</span>
            <div style="display: flex; gap: 6px"><sc-for list="{{jlOpd}}" as="st" hint-placeholder-count="6"><button aria-pressed="{{st.on}}" style="width: 34px; height: 30px; border-radius: 8px; border: 1px solid {{st.border}}; background: {{st.bg}}; color: {{st.color}}; font: inherit; font-size: 13px; font-weight: {{st.w}}; cursor: pointer">{{st.label}}</button></sc-for></div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: .6px; color: #5D6675">OBSERVATIES <span style="font-weight: 400; letter-spacing: 0">· deze opdracht past bij</span></span>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            <sc-for list="{{obsChips}}" as="o" hint-placeholder-count="8"><button aria-pressed="{{o.on}}" style="height: 30px; padding: 0 12px 0 6px; border-radius: 999px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font: inherit; font-size: 13px; font-weight: {{o.w}}; cursor: pointer; display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="font-size: 15px">{{o.e}}</span>{{o.name}}</button></sc-for>
          </div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 14px 24px 18px; border-top: 1px solid #E1E4EA">
        <button style="height: 36px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: #2560BF; font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Inhoud bewerken in de editor</button>
        <div style="flex: 1"></div>
        <button style="height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid #C9CED8; background: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">Annuleren</button>
        <button style="height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid #2F6FD6; background: #2F6FD6; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">Opslaan</button>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { view: 'obs', cat: 'Alle', emoji: '🎯', kinds: { Toets: true, PO: false } }; }
  renderVals() {
    const views = [['obs', 'Observatie bewerken'], ['opd', 'Opdracht bewerken']].map(([k, label]) => ({ label, sel: this.state.view === k ? 'true' : 'false', bg: this.state.view === k ? '#FFFFFF' : 'transparent', fg: this.state.view === k ? '#1B2230' : '#C9CED8', pick: () => this.setState({ view: k }) }));
    const E = {
      'Natuurkunde': '⚡ 🔋 🔌 💡 🧲 🔭 🛰️ 🚀 🪐 ☀️ 🌙 🌡️ ⚖️ ⏱️ ⏲️ 🌊 🔊 🎵 🌈 🔦 ⚙️ 🔩 🧊 💨',
      'Scheikunde': '🧪 ⚗️ 🧫 🔬 🧯 🔥 💧 🫧 🧂 🧴 ☢️ ☣️ ⚛️ 🪨 💎 🧱 🛢️ 🍋',
      'Biologie': '🧬 🦠 🌱 🌿 🍃 🌳 🌸 🐝 🐛 🦋 🐟 🐸 🫀 🫁 🧠 🦴 👁️ 🦷 🩸 🍄',
      'Wiskunde': '📐 📏 🧮 ➕ ➖ ✖️ ➗ 🟰 ♾️ 📈 📉 📊 🔢 🔣 🎲 🧩 🔺 🔷 ⭕ 🟦',
      'Leren & school': '📚 📖 📝 ✏️ 🖊️ 🖍️ 📎 📌 🗂️ 📋 🗒️ 🎓 🏫 💭 🤔 🙋 ✍️ 🗣️ 👀 👂 💪 🧘 ⏳ 🗓️ 🔁 🔄 🔍 🔎 🎯 🏁',
      'Fouten & aandacht': '❓ ❗ ⚠️ ✅ ❌ 🚫 ⛔ 🔴 🟠 🟡 🟢 🔵 ⭐ 🌟 💥 🔔 🧭 🪜 🧷 🔗',
    };
    const all = Object.entries(E).map(([label, s]) => ({ label, items: s.split(' ') }));
    const cats = ['Alle', ...Object.keys(E)].map((label) => ({ label, sel: this.state.cat === label ? 'true' : 'false', bd: this.state.cat === label ? '#2F6FD6' : '#E1E4EA', bg: this.state.cat === label ? '#2F6FD614' : '#FFFFFF', fg: this.state.cat === label ? '#2560BF' : '#1B2230', pick: () => this.setState({ cat: label }) }));
    const shown = all.filter((g) => this.state.cat === 'Alle' || g.label === this.state.cat);
    const groupsE = shown.map((g) => ({ label: g.label.toUpperCase(), items: g.items.map((e) => ({ e, bd: e === this.state.emoji ? '#2F6FD6' : 'transparent', bg: e === this.state.emoji ? '#2F6FD614' : 'transparent', pick: () => this.setState({ emoji: e }) })) }));
    const chip = (label, on) => ({ label, on: on ? 'true' : 'false', border: on ? '#2F6FD6' : '#E1E4EA', bg: on ? '#2F6FD614' : '#FFFFFF', color: on ? '#2560BF' : '#1B2230', w: on ? 600 : 400 });
    const OBS = [['📏', 'Eenheid vergeten', true], ['➗', 'Formule verkeerd omgeschreven', true], ['📈', 'Grafiek: aslabels vergeten', false], ['📉', 'Grafiek: helling', false], ['🔄', 'Meetwaarde verkeerd omgerekend', false], ['🧮', 'Rekenfout', false], ['🎯', 'Significantie antwoord verkeerd', true], ['❓', 'Grootheden door elkaar', false]];
    return {
      views, isObs: this.state.view === 'obs', isOpd: this.state.view === 'opd', cats, groupsE, emoji: this.state.emoji,
      emojiCount: all.reduce((s, g) => s + g.items.length, 0) + ' van 200+',
      types: ['Vmbo-bb', 'Vmbo-kb', 'Vmbo-gl', 'Vmbo-tl', 'Havo', 'Vwo', 'Gymnasium'].map((l) => chip(l, l === 'Gymnasium')),
      vakken: ['Biologie', 'Natuurkunde', 'Scheikunde', 'Wiskunde'].map((l) => chip(l, l === 'Natuurkunde' || l === 'Scheikunde')),
      jl: [1, 2, 3, 4, 5, 6].map((n) => chip(String(n), n >= 4)),
      kinds: ['Toets', 'PO'].map((k) => ({ ...chip(k, this.state.kinds[k]), pick: () => { const nk = { ...this.state.kinds, [k]: !this.state.kinds[k] }; if (!nk.Toets && !nk.PO) return; this.setState({ kinds: nk }); } })),
      jlOpd: [1, 2, 3, 4, 5, 6].map((n) => chip(String(n), n >= 4)),
      obsChips: OBS.map(([e, name, on]) => ({ e, name, on: on ? 'true' : 'false', bd: on ? '#2F6FD6' : '#E1E4EA', bg: on ? '#2F6FD614' : '#FFFFFF', fg: on ? '#2560BF' : '#1B2230', w: on ? 600 : 400 })),
    };
  }
}
</script>
</body>
</html>
