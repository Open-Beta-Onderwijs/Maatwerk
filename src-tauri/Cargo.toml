[package]
name = "maatwerk-app"
description = "Maatwerk desktop app: thin Tauri shell over maatwerk-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "maatwerk_app"
crate-type = ["rlib"]

[[bin]]
name = "maatwerk"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
maatwerk-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Start error message box without a webview (`start_error.rs`); in the tree via the dialog plugin.
rfd = { version = "0.17.2", default-features = false }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.13"
tauri.workspace = true
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi", "tracing-log"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
