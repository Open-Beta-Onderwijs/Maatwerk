# SPDX-License-Identifier: AGPL-3.0-or-later
# cargo-deny: licence allowlist and supply-chain checks (PLAN.md 2.5).
# Only AGPL-compatible licences may be shipped in the exe.

[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[licenses]
confidence-threshold = 0.9
# The allowlist is policy, not inventory: entries may be unused today.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "OFL-1.1",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "GPL-3.0-or-later",
  "AGPL-3.0-or-later",
]

[licenses.private]
# Our own workspace crates are AGPL and unpublished.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # quick-xml 0.38 comes in through typst 0.15.1 -> hayagriva 0.10.1 -> citationberg 0.7.0 (CSL
  # styles for bibliographies). The fix needs quick-xml >= 0.41; citationberg 0.7.0, the newest
  # (2026-11-25), still asks for ^0.38 (step 39b). Impact: slow parsing / memory use on a hostile
  # CSL/XML file that a teacher's own opdracht names; no remote input. Decision 84 wants these
  # gone at 1.0: re-check in step 45a.
  { id = "RUSTSEC-2026-0194", reason = "citationberg 0.7.0 pins quick-xml 0.38; local DoS only" },
  { id = "RUSTSEC-2026-0195", reason = "citationberg 0.7.0 pins quick-xml 0.38; local DoS only" },
]
