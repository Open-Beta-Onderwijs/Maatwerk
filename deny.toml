# cargo-deny: licence allowlist and supply-chain checks (PLAN.md 2.5).
# Only AGPL-compatible licences may be shipped in the exe.

[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[licenses]
confidence-threshold = 0.9
# The allowlist is policy, not inventory: entries may be unused today.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "OFL-1.1",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "GPL-3.0-or-later",
  "AGPL-3.0-or-later",
]

[licenses.private]
# Our own workspace crates are AGPL and unpublished.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # quick-xml 0.38 comes in through typst 0.14.2 -> hayagriva -> citationberg (CSL styles for
  # bibliographies). The fix needs quick-xml >= 0.41, which the pinned typst 0.14 line cannot take.
  # Impact: slow parsing / memory use on a hostile CSL/XML file that a teacher's own opdracht
  # names; no remote input. Re-check when leaving typst 0.14 (Step 5, docs/backlog.md).
  { id = "RUSTSEC-2026-0194", reason = "typst 0.14.2 pins quick-xml 0.38; local DoS only" },
  { id = "RUSTSEC-2026-0195", reason = "typst 0.14.2 pins quick-xml 0.38; local DoS only" },
]
