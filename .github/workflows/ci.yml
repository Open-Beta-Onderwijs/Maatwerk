name: CI

on:
  push:
    branches: [main, 'step/**']
    # A version tag builds the release exe (docs/release.md); publishing it stays manual.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Licences, SPDX, layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SPDX headers
        run: bash tools/check-spdx.sh
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: maatwerk-core must not depend on tauri
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree -p maatwerk-core --target all -e normal,build --prefix none)"
          if grep -E '^tauri' <<<"$tree"; then
            echo "maatwerk-core depends on tauri"; exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm licence allowlist
        run: npm run licenses
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      # The generator runs cargo-about offline: fetch every crate source first.
      - run: cargo fetch --locked
      - name: Third-party notices up to date
        run: npm run notices -- --check

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # One command per step: pwsh only reports the exit code of the last line.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Playwright on the mock build: smoke, UI quirks, CSP walkthrough (not the local visual project).
      - run: npx playwright install chromium
        working-directory: ui
      - run: npm run test:e2e
      # Visual baselines, light look (step 16b; docs/testing.md "Visual baselines in CI"). No
      # baseline folder for this platform yet: write them, upload, commit the artifact.
      - name: Visual comparison (visual-ci-chromium)
        shell: bash
        working-directory: ui
        run: |
          set -euo pipefail
          dir="e2e/visual-baselines/visual-ci-chromium-$(node -p process.platform)"
          if [ -d "$dir" ]; then
            npx playwright test visual --project visual-ci-chromium
          else
            echo "::warning::No visual baselines in ui/$dir: writing them; commit the artifact visual-windows."
            npx playwright test visual --project visual-ci-chromium --update-snapshots=all
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-windows
          path: |
            ui/e2e/visual-baselines/
            ui/test-results/
          if-no-files-found: ignore
      # tauri::generate_context! needs ui/dist to exist before clippy and test.
      - run: npm run build:ui
      # TauriApi is the only backend in the app bundle (Step 6b): no MockApi or its test hooks.
      - name: No MockApi in the app bundle
        shell: bash
        run: "test -d ui/dist && ! grep -rl -e '__maatwerkMock' -e 'Maatwerk-mock' ui/dist"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The v1 -> v2 migration on the large synthetic fixture must validate without errors.
      - name: Migrate and validate the school fixture
        shell: bash
        run: |
          node tools/fixtures/generate.mjs school "$RUNNER_TEMP/mig/shared/data"
          cargo run -q -p maatwerk-cli -- migrate "$RUNNER_TEMP/mig/shared/data" --apply --backup-dir "$RUNNER_TEMP/mig/backups"
          cargo run -q -p maatwerk-cli -- validate-data "$RUNNER_TEMP/mig/shared/data" > /dev/null
      # A real compiled rapport (written by the typst_rapport tests) in pdf.js under the CSP.
      - run: npx playwright test --project=chromium real-pdf
        working-directory: ui
        env:
          MAATWERK_REAL_PDF: '1'
      - name: Portable exe
        run: npm run build:exe
      # Only upload an exe whose shipped npm dependencies pass the allowlist (review 3a M3).
      - name: npm licence allowlist (before upload)
        run: npm run licenses
      - name: SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/maatwerk.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  maatwerk.exe" | Set-Content -Encoding ascii -NoNewline target/release/maatwerk.exe.sha256
          Get-Content target/release/maatwerk.exe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: maatwerk-windows-x64
          path: |
            target/release/maatwerk.exe
            target/release/maatwerk.exe.sha256
            LICENSE
            THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  # Step 16a (X-04): the WebKit engine and a universal macOS app. Unsigned (user decision
  # 2026-11-06): ad-hoc signed so it runs on Apple Silicon; README "macOS" explains "Open anyway".
  macos:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (from rust-toolchain.toml) and both Mac targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The e2e suite on Playwright's WebKit (close to WKWebView; not the visual project).
      - run: npx playwright install webkit
        working-directory: ui
      - run: npm run test:e2e:webkit
      # Visual baselines, light look (step 16b; docs/testing.md "Visual baselines in CI"). No
      # baseline folder for this platform yet: write them, upload, commit the artifact.
      - name: Visual comparison (visual-ci-webkit)
        shell: bash
        working-directory: ui
        run: |
          set -euo pipefail
          dir="e2e/visual-baselines/visual-ci-webkit-$(node -p process.platform)"
          if [ -d "$dir" ]; then
            npx playwright test visual --project visual-ci-webkit
          else
            echo "::warning::No visual baselines in ui/$dir: writing them; commit the artifact visual-macos."
            npx playwright test visual --project visual-ci-webkit --update-snapshots=all
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-macos
          path: |
            ui/e2e/visual-baselines/
            ui/test-results/
          if-no-files-found: ignore
      - run: npm run build:ui
      - run: cargo test --workspace
      # A real compiled rapport (written by the typst_rapport tests) in pdf.js on WebKit.
      - run: npx playwright test --project=webkit real-pdf
        working-directory: ui
        env:
          MAATWERK_REAL_PDF: '1'
      - name: Universal app (Maatwerk.app and .dmg)
        run: npm run build:mac
      - name: Zip the app, checksums
        run: |
          set -euo pipefail
          bundle=target/universal-apple-darwin/release/bundle
          mkdir -p dist-mac
          ditto -c -k --keepParent "$bundle/macos/Maatwerk.app" dist-mac/Maatwerk-macos-universal.zip
          cp "$bundle"/dmg/*.dmg dist-mac/Maatwerk-macos-universal.dmg
          lipo -archs "$bundle/macos/Maatwerk.app/Contents/MacOS/maatwerk"
          codesign --verify --verbose "$bundle/macos/Maatwerk.app"
          (cd dist-mac && shasum -a 256 *.zip *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cp LICENSE THIRD_PARTY_NOTICES.txt dist-mac/
      - uses: actions/upload-artifact@v7
        with:
          name: maatwerk-macos-universal
          path: dist-mac/
          if-no-files-found: error

  # Step 16b: WebKitGTK and the Linux packages (AppImage and .deb). Built on Ubuntu 24.04, so
  # they need glibc 2.39+ (Ubuntu 24.04, Mint 22, Debian 13 or newer).
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: WebKitGTK and the other Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential file patchelf
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The e2e suite on Playwright's WebKit for Linux (close to WebKitGTK; not the visual project).
      - run: npx playwright install --with-deps webkit
        working-directory: ui
      - run: npm run test:e2e:webkit
      # Visual baselines, light look (step 16b; docs/testing.md "Visual baselines in CI"). No
      # baseline folder for this platform yet: write them, upload, commit the artifact.
      - name: Visual comparison (visual-ci-webkit)
        shell: bash
        working-directory: ui
        run: |
          set -euo pipefail
          dir="e2e/visual-baselines/visual-ci-webkit-$(node -p process.platform)"
          if [ -d "$dir" ]; then
            npx playwright test visual --project visual-ci-webkit
          else
            echo "::warning::No visual baselines in ui/$dir: writing them; commit the artifact visual-linux."
            npx playwright test visual --project visual-ci-webkit --update-snapshots=all
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-linux
          path: |
            ui/e2e/visual-baselines/
            ui/test-results/
          if-no-files-found: ignore
      - run: npm run build:ui
      # Unix-only code paths (cfg(not(windows))) are only linted here.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The migration on a case-sensitive file system.
      - name: Migrate and validate the school fixture
        run: |
          node tools/fixtures/generate.mjs school "$RUNNER_TEMP/mig/shared/data"
          cargo run -q -p maatwerk-cli -- migrate "$RUNNER_TEMP/mig/shared/data" --apply --backup-dir "$RUNNER_TEMP/mig/backups"
          cargo run -q -p maatwerk-cli -- validate-data "$RUNNER_TEMP/mig/shared/data" > /dev/null
      - run: npx playwright test --project=webkit real-pdf
        working-directory: ui
        env:
          MAATWERK_REAL_PDF: '1'
      - name: AppImage and .deb
        run: npm run build:linux
      - name: Checksums
        run: |
          set -euo pipefail
          bundle=target/release/bundle
          mkdir -p dist-linux
          cp "$bundle"/appimage/*.AppImage dist-linux/Maatwerk-linux-x86_64.AppImage
          cp "$bundle"/deb/*.deb dist-linux/maatwerk-linux-amd64.deb
          dpkg-deb --info dist-linux/maatwerk-linux-amd64.deb
          (cd dist-linux && sha256sum *.AppImage *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cp LICENSE THIRD_PARTY_NOTICES.txt dist-linux/
      - uses: actions/upload-artifact@v7
        with:
          name: maatwerk-linux-x86_64
          path: dist-linux/
          if-no-files-found: error
