name: CI

on:
  push:
    branches: [main, 'step/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Licences, SPDX, layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SPDX headers
        run: bash tools/check-spdx.sh
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: maatwerk-core must not depend on tauri
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree -p maatwerk-core --target all -e normal,build --prefix none)"
          if grep -E '^tauri' <<<"$tree"; then
            echo "maatwerk-core depends on tauri"; exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm licence allowlist
        run: npm run licenses

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # One command per step: pwsh only reports the exit code of the last line.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Playwright on the mock build: smoke, UI quirks, CSP walkthrough (not the local visual project).
      - run: npx playwright install chromium
        working-directory: ui
      - run: npm run test:e2e
      # tauri::generate_context! needs ui/dist to exist before clippy and test.
      - run: npm run build:ui
      # TauriApi is the only backend in the app bundle (Step 6b): no MockApi or its test hooks.
      - name: No MockApi in the app bundle
        shell: bash
        run: "! grep -rl -e '__maatwerkMock' -e 'Maatwerk-mock' ui/dist"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # A real compiled rapport (written by the typst_rapport tests) in pdf.js under the CSP.
      - run: npx playwright test --project chromium real-pdf
        working-directory: ui
      - name: Portable exe
        run: npm run build:exe
      # Only upload an exe whose shipped npm dependencies pass the allowlist (review 3a M3).
      - name: npm licence allowlist (before upload)
        run: npm run licenses
      - uses: actions/upload-artifact@v7
        with:
          name: maatwerk-windows-x64
          path: target/release/maatwerk.exe
          if-no-files-found: error
