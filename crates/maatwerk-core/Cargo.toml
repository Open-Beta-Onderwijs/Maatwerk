[package]
name = "maatwerk-core"
description = "Maatwerk core: storage, Typst service and domain plumbing. Never depends on tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
notify = "8.2.1"
ryu = "1.0.23"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3", features = ["local-offset"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Typst 0.14.2 to match the reference CLI (PLAN section 1). No `packages` feature on typst-kit:
# packages are embedded, never downloaded (ADR-0002 5a).
typst = "=0.14.2"
typst-kit = { version = "=0.14.2", default-features = false, features = ["fonts", "embed-fonts"] }
typst-pdf = "=0.14.2"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tiny-skia = "0.11.4"
typst-render = "=0.14.2"
