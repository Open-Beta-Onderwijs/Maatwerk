[package]
name = "maatwerk-core"
description = "Maatwerk core: storage, Typst service and domain plumbing. Never depends on tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
ryu = "1.0.23"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.11.0"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
