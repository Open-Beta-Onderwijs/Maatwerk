[package]
name = "maatwerk-grades-wasm"
description = "The grade rules for the UI: maatwerk-grades behind a small WebAssembly interface (ADR-0011)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
maatwerk-grades.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }

# Not `workspace = true`: this is the only crate that needs `unsafe`, for the memory interface in
# `abi.rs`, which exists only in the wasm build.
[lints.clippy]
all = { level = "warn", priority = -1 }
