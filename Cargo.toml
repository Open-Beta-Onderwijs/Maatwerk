[workspace]
resolver = "3"
members = ["crates/maatwerk-grades", "crates/maatwerk-grades-wasm", "crates/maatwerk-core", "crates/maatwerk-cli", "src-tauri"]

[workspace.package]
version = "0.19.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
maatwerk-core = { path = "crates/maatwerk-core" }
maatwerk-grades = { path = "crates/maatwerk-grades" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Argon2 is unusably slow unoptimised (PIN tests and dev builds).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
