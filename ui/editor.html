<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>Opdracht bewerken</title>
    <link rel="stylesheet" href="/src/editor.css" />
  </head>
  <body>
    <div id="editor-topbar">
      <button id="btn-app-title" title="Terug naar de opdrachtenlijst">Maatwerk</button>
      <span id="editor-title"
        >Opdracht bewerken: <strong><em id="editor-title-naam"></em></strong
      ></span>
      <span id="editor-status"></span>
      <button id="editor-badge-btn" title="Klik om uit te loggen">?</button>
    </div>
    <div id="editor-toolbar">
      <!-- Group 1: Text formatting -->
      <div class="tb-group" id="tb-text">
        <button class="tb-btn" data-action="bold" title="Vet"><b>B</b></button>
        <button class="tb-btn" data-action="italic" title="Cursief"><i>I</i></button>
        <button class="tb-btn" data-action="underline" title="Onderstrepen"><u>U</u></button>
        <button
          class="tb-btn"
          data-action="more-text"
          title="Meer opties"
          data-popup="popup-more-text"
        >
          ···
        </button>
      </div>
      <div id="popup-more-text" class="tb-popup" style="display: none">
        <div class="tb-popup-grid">
          <button class="tb-btn" data-action="overline" title="Bovenlijn">Ā</button>
          <button class="tb-btn" data-action="strike" title="Doorhalen"><s>S</s></button>
          <button class="tb-btn" data-action="highlight" title="Markeren">
            <span class="tb-icon-highlight">A</span>
          </button>
          <button class="tb-btn" data-action="lower" title="Kleine letters">↓a</button>
          <button class="tb-btn" data-action="upper" title="Hoofdletters">↑A</button>
          <button class="tb-btn" data-action="smallcaps" title="Kleine kapitalen">Aᴀ</button>
          <button class="tb-btn" data-action="sub" title="Subscript">x₂</button>
          <button class="tb-btn" data-action="super" title="Superscript">x²</button>
          <button class="tb-btn" data-action="quote" title="Citaat">“ ”</button>
        </div>
      </div>

      <div class="tb-divider"></div>

      <!-- Group 2: Block & structure -->
      <div class="tb-group" id="tb-block">
        <button class="tb-btn" data-action="list" title="Opsomming">•≡</button>
        <button class="tb-btn" data-action="enumerate" title="Genummerde lijst">1≡</button>
        <button class="tb-btn" data-action="math" title="Wiskundige formule">$x$</button>
        <button class="tb-btn" data-action="codeblock" title="Codeblok">&lt;/&gt;</button>
        <button
          class="tb-btn"
          data-action="reference"
          title="Verwijzing"
          data-popup="popup-reference"
        >
          @
        </button>
      </div>
      <div id="popup-reference" class="tb-popup" style="display: none">
        <div class="tb-ref-panel">
          <div class="tb-ref-list" id="ref-list"></div>
        </div>
      </div>

      <div class="tb-divider"></div>

      <!-- Group 2a: Content blocks -->
      <div class="tb-group" id="tb-blocks">
        <button class="tb-btn tb-btn-wide" data-action="blok-formule" title="Formule-blok">
          🧮
        </button>
        <button class="tb-btn tb-btn-wide" data-action="blok-voorbeeld" title="Voorbeeld-blok">
          💡
        </button>
        <button class="tb-btn tb-btn-wide" data-action="blok-context" title="Context-blok">
          📖
        </button>
        <button class="tb-btn tb-btn-wide" data-action="blok-belangrijk" title="Belangrijk-blok">
          ❗
        </button>
      </div>

      <div class="tb-divider"></div>

      <!-- Group 2a': Exercises -->
      <div class="tb-group" id="tb-opgaven">
        <button class="tb-btn tb-btn-wide" data-action="opgave-add" title="Nieuwe opgave">
          ➕
        </button>
        <button class="tb-btn tb-btn-wide" data-action="vraag-add" title="Nieuwe vraag">❓</button>
      </div>

      <div class="tb-divider"></div>

      <!-- Group 2b: Insert -->
      <div class="tb-group" id="tb-insert">
        <button class="tb-btn tb-btn-wide" data-action="figure" title="Figuur toevoegen">🖼️</button>
        <button
          class="tb-btn tb-btn-wide"
          data-action="tabel-open"
          data-popup="popup-tabel"
          title="Nieuwe tabel…"
        >
          🗓️
        </button>
        <button
          class="tb-btn tb-btn-wide"
          data-action="grid-open"
          data-popup="popup-grid"
          title="Nieuw grid…"
        >
          🪟
        </button>
      </div>
      <div id="popup-figure" class="tb-popup" style="display: none">
        <div class="tb-fig-panel"></div>
      </div>
      <div id="popup-tabel" class="tb-popup" style="display: none"></div>
      <div id="popup-grid" class="tb-popup" style="display: none"></div>

      <div class="tb-divider"></div>

      <!-- Group 3: Math elements -->
      <div class="tb-group" id="tb-math">
        <button class="tb-btn" data-action="math-accent" title="Accent">â</button>
        <button class="tb-btn" data-action="math-binom" title="Binomiaalcoëfficiënt">(ⁿₖ)</button>
        <button class="tb-btn" data-action="math-cancel" title="Doorstrepen">x̸</button>
        <button class="tb-btn" data-action="math-cases" title="Gevallen">{⋯</button>
        <button
          class="tb-btn tb-math-extra"
          data-action="math-numeq"
          title="Genummerde vergelijking"
        >
          (1)
        </button>
        <button class="tb-btn tb-math-extra" data-action="math-frac" title="Breuk">½</button>
        <button class="tb-btn tb-math-extra" data-action="math-lr" title="Haakjes aanpassen">
          ⟨⟩
        </button>
        <button class="tb-btn tb-math-extra" data-action="math-mat" title="Matrix">(⋱)</button>
        <button class="tb-btn tb-math-extra" data-action="math-primes" title="Priemnotatie">
          f′
        </button>
        <button class="tb-btn tb-math-extra" data-action="math-root" title="Wortel">ⁿ√</button>
        <button class="tb-btn tb-math-extra" data-action="math-sizes" title="Formaat">↕</button>
        <button class="tb-btn tb-math-extra" data-action="math-op" title="Tekstoperator">
          sin
        </button>
        <button
          class="tb-btn tb-math-extra"
          data-action="math-variants"
          title="Lettertypevarianten"
        >
          𝔸
        </button>
        <button class="tb-btn tb-math-extra" data-action="math-vec" title="Vector">(⋮)</button>
        <button
          class="tb-btn tb-math-more"
          data-action="math-more"
          data-popup="popup-math-extra"
          title="Meer wiskundige elementen"
        >
          ···
        </button>
      </div>
      <div id="popup-math-extra" class="tb-popup" style="display: none">
        <div class="tb-popup-grid" style="grid-template-columns: repeat(4, 28px)">
          <button class="tb-btn" data-action="math-numeq" title="Genummerde vergelijking">
            (1)
          </button>
          <button class="tb-btn" data-action="math-frac" title="Breuk">½</button>
          <button class="tb-btn" data-action="math-lr" title="Haakjes aanpassen">⟨⟩</button>
          <button class="tb-btn" data-action="math-mat" title="Matrix">(⋱)</button>
          <button class="tb-btn" data-action="math-primes" title="Priemnotatie">f′</button>
          <button class="tb-btn" data-action="math-root" title="Wortel">ⁿ√</button>
          <button class="tb-btn" data-action="math-sizes" title="Formaat">↕</button>
          <button class="tb-btn" data-action="math-op" title="Tekstoperator">sin</button>
          <button class="tb-btn" data-action="math-variants" title="Lettertypevarianten">𝔸</button>
          <button class="tb-btn" data-action="math-vec" title="Vector">(⋮)</button>
        </div>
      </div>

      <div class="tb-divider"></div>

      <!-- Group 4: Symbol pickers -->
      <div class="tb-group" id="tb-symbols">
        <button
          class="tb-btn"
          data-action="sym-letterlike"
          title="Letterachtige symbolen"
          data-popup="popup-sym-letterlike"
        >
          ℝ
        </button>
        <button
          class="tb-btn"
          data-action="sym-math"
          title="Wiskundige symbolen"
          data-popup="popup-sym-math"
        >
          ∈
        </button>
        <button
          class="tb-btn"
          data-action="sym-misc"
          title="Overige symbolen"
          data-popup="popup-sym-misc"
        >
          ☆
        </button>
        <button class="tb-btn" data-action="sym-emoji" title="Emoji" data-popup="popup-sym-emoji">
          🙂
        </button>
      </div>
      <div id="popup-sym-letterlike" class="tb-popup" style="display: none"></div>
      <div id="popup-sym-math" class="tb-popup" style="display: none"></div>
      <div id="popup-sym-misc" class="tb-popup" style="display: none"></div>
      <div id="popup-sym-emoji" class="tb-popup" style="display: none"></div>
    </div>

    <div id="editor-body">
      <div id="cm-container"></div>
      <div id="pdf-panel">
        <div id="preview-bar">
          <button class="pv-btn" id="pv-zoom-out" title="Uitzoomen">−</button>
          <span id="pv-zoom-label">100%</span>
          <button class="pv-btn" id="pv-zoom-in" title="Inzoomen">+</button>
          <button class="pv-btn" id="pv-fit-width" title="Paginabreedte">Paginabreedte</button>
        </div>
        <div id="pdf-placeholder">Bezig met renderen…</div>
        <div id="svg-viewer" style="display: none"></div>
      </div>
    </div>
    <!-- Context menu -->
    <div id="cm-context-menu" style="display: none">
      <button class="cm-ctx-item" data-cm-action="cut">
        <span class="cm-ctx-icon">✂️</span>Knippen
      </button>
      <button class="cm-ctx-item" data-cm-action="copy">
        <span class="cm-ctx-icon">📋</span>Kopiëren
      </button>
      <button class="cm-ctx-item" data-cm-action="paste">
        <span class="cm-ctx-icon">📌</span>Plakken
      </button>
      <div class="cm-ctx-divider"></div>
      <button class="cm-ctx-item" data-cm-action="comment">
        <span class="cm-ctx-icon">💬</span>Opmerking aan/uit
      </button>
    </div>

    <div id="error-popover" style="display: none"></div>
    <script type="module" src="/src/editor-init.js"></script>
  </body>
</html>
